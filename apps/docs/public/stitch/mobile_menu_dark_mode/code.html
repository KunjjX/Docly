<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Docly Mobile Menu Drawer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006ef5",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1823",
                        "docly-black": "#000000",
                        "docly-blue": "#0070F3",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 font-display">
<!-- Mobile Drawer Container (Simulating 375px screen) -->
<div class="w-full max-w-[375px] h-[812px] bg-docly-black text-white relative flex flex-col shadow-2xl overflow-hidden rounded-xl border border-gray-800">
<!-- Background decorative glow (subtle) -->
<div class="absolute top-0 left-0 w-full h-64 bg-primary/10 blur-[80px] pointer-events-none rounded-full transform -translate-y-1/2"></div>
<!-- Header -->
<header class="flex items-center justify-between px-6 py-6 z-10">
<!-- Logo Area -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded bg-gradient-to-br from-primary to-blue-400 flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-icons text-white text-lg">description</span>
</div>
<span class="text-xl font-bold tracking-tight">Docly</span>
</div>
<!-- Close Icon -->
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-900 transition-colors group">
<span class="material-icons text-3xl text-gray-400 group-hover:text-white transition-colors">close</span>
</button>
</header>
<!-- Navigation Links -->
<nav class="flex-1 flex flex-col justify-start px-8 pt-8 z-10 overflow-y-auto">
<ul class="flex flex-col space-y-8">
<li>
<a class="text-2xl font-bold text-white hover:text-primary transition-colors block" href="#">Features</a>
</li>
<li>
<a class="text-2xl font-bold text-docly-blue flex items-center gap-3" href="#">
                        Documentation
                        <span class="w-1.5 h-1.5 rounded-full bg-docly-blue block mt-1"></span>
</a>
</li>
<li>
<a class="text-2xl font-bold text-white hover:text-primary transition-colors block" href="#">Changelog</a>
</li>
<li>
<a class="text-2xl font-bold text-white hover:text-primary transition-colors flex items-center gap-2 block" href="#">
                        GitHub
                        <span class="material-icons text-gray-500 text-xl transform rotate-45">arrow_upward</span>
</a>
</li>
<li>
<a class="text-2xl font-bold text-white hover:text-primary transition-colors flex items-center gap-2 block" href="#">
                        npm
                        <span class="material-icons text-gray-500 text-xl transform rotate-45">arrow_upward</span>
</a>
</li>
</ul>
</nav>
<!-- Bottom Actions Section -->
<div class="px-6 pb-8 z-10">
<!-- Divider -->
<div class="w-full h-px bg-gray-800 mb-6"></div>
<!-- Search Input -->
<div class="relative mb-4 group">
<span class="material-icons absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 group-focus-within:text-primary transition-colors">search</span>
<input class="w-full bg-gray-900 border border-gray-800 text-white pl-12 pr-4 py-3.5 rounded-lg focus:ring-2 focus:ring-docly-blue focus:border-transparent placeholder-gray-500 text-sm transition-all" placeholder="Search Documentation..." type="text"/>
</div>
<!-- CTA Button -->
<button class="w-full bg-docly-blue hover:bg-blue-600 text-white font-bold py-4 rounded-lg shadow-lg shadow-blue-900/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Get Started</span>
<span class="material-icons text-sm font-bold">arrow_forward</span>
</button>
<!-- Footer Info -->
<div class="mt-6 flex justify-between items-center text-xs text-gray-600">
<span>v2.4.0</span>
<div class="flex gap-4">
<a class="hover:text-gray-400" href="#">Terms</a>
<a class="hover:text-gray-400" href="#">Privacy</a>
</div>
</div>
</div>
</div>
</body></html>
