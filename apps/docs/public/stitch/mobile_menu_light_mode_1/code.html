<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Docly Mobile Menu Light Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0c6de4",
                        "primary-dark": "#0a5bc4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Mobile Device Simulation Wrapper */
        .mobile-wrapper {
            max-width: 430px; /* iPhone 14 Pro Max width approx */
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            min-height: 100vh;
            border-left: 1px solid rgba(0,0,0,0.05);
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-100 font-display flex items-center justify-center min-h-screen p-4 md:p-8">
<!-- Mobile Simulation Container -->
<div class="mobile-wrapper bg-white relative w-full overflow-hidden flex flex-col">
<!-- Header Section -->
<header class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
<!-- Logo -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-bold text-lg">
                    D
                </div>
<span class="text-xl font-bold text-gray-900 tracking-tight">Docly</span>
</div>
<!-- Close Button -->
<button aria-label="Close Menu" class="group p-2 -mr-2 rounded-full hover:bg-gray-100 transition-colors duration-200">
<span class="material-icons text-gray-500 group-hover:text-gray-900 text-3xl">close</span>
</button>
</header>
<!-- Main Navigation Content -->
<nav class="flex-1 px-6 py-8 overflow-y-auto">
<ul class="space-y-6">
<!-- Standard Item -->
<li>
<a class="block text-2xl font-semibold text-gray-900 hover:text-primary transition-colors duration-200" href="#">
                        Features
                    </a>
</li>
<!-- Standard Item -->
<li>
<a class="block text-2xl font-semibold text-gray-900 hover:text-primary transition-colors duration-200" href="#">
                        Pricing
                    </a>
</li>
<!-- Highlighted Active Item -->
<li>
<a class="flex items-center gap-3 text-2xl font-semibold text-primary transition-colors duration-200" href="#">
                        Documentation
                        <span class="px-2 py-0.5 text-xs font-bold uppercase tracking-wider text-white bg-primary rounded-full">New</span>
</a>
<!-- Sub-navigation for Documentation context -->
<ul class="mt-4 ml-1 pl-4 border-l-2 border-primary/20 space-y-3">
<li>
<a class="block text-base font-medium text-gray-600 hover:text-primary" href="#">Getting Started</a>
</li>
<li>
<a class="block text-base font-medium text-gray-600 hover:text-primary" href="#">API Reference</a>
</li>
<li>
<a class="block text-base font-medium text-gray-600 hover:text-primary" href="#">CLI Commands</a>
</li>
</ul>
</li>
<!-- Standard Item -->
<li>
<a class="block text-2xl font-semibold text-gray-900 hover:text-primary transition-colors duration-200" href="#">
                        GitHub
                    </a>
</li>
<!-- Standard Item -->
<li>
<a class="block text-2xl font-semibold text-gray-900 hover:text-primary transition-colors duration-200" href="#">
                        Blog
                    </a>
</li>
</ul>
<!-- Additional Links / Resources -->
<div class="mt-12 pt-8 border-t border-gray-100">
<p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-4">Resources</p>
<div class="grid grid-cols-2 gap-4">
<a class="flex flex-col gap-2 group" href="#">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-icons text-primary text-xl">school</span>
</div>
<span class="text-sm font-medium text-gray-700">Guides</span>
</a>
<a class="flex flex-col gap-2 group" href="#">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-icons text-primary text-xl">groups</span>
</div>
<span class="text-sm font-medium text-gray-700">Community</span>
</a>
</div>
</div>
</nav>
<!-- Footer Actions -->
<div class="px-6 py-6 bg-white border-t border-gray-100 mt-auto">
<!-- Theme Toggle -->
<div class="flex items-center justify-between mb-6 p-1 bg-gray-100 rounded-lg">
<button class="flex-1 flex items-center justify-center gap-2 py-2 px-4 bg-white rounded shadow-sm text-gray-900 font-medium text-sm transition-all">
<span class="material-icons text-base">light_mode</span>
                    Light
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 px-4 text-gray-500 font-medium text-sm hover:text-gray-900 transition-all">
<span class="material-icons text-base">dark_mode</span>
                    Dark
                </button>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold text-lg py-4 rounded-lg shadow-lg shadow-primary/30 transition-all duration-200 flex items-center justify-center gap-2">
                Get Started
                <span class="material-icons text-xl">arrow_forward</span>
</button>
<p class="text-center text-xs text-gray-400 mt-4">
                © 2023 Docly Inc. v2.4.0
            </p>
</div>
</div>
</body></html>
